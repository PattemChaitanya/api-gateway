<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Gateway - Welcome</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
            padding: 50px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>API Gateway</h1>
    <p>Welcome to the API Gateway service. This is a simple API gateway for learning and experiments with building
        complex and robust environments.</p>

    <div>
        <a href="/api-docs" class="btn">API Documentation</a>
        <a href="/docs" class="btn">Developer Guide</a>
    </div>

    <div style="margin-top: 30px">
        <h2>API Health Status</h2>
        <p>Check the <a href="/.netlify/functions/health">Health Status</a> of the API</p>
    </div>
</body>

</html>
