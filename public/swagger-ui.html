<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Gateway - Swagger UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui.min.css">
  <link rel="stylesheet" href="/swagger-custom.css">
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #swagger-ui {
      max-width: 1460px;
      margin: 0 auto;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui-bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      // Determine the base URL based on the environment
      const isNetlify = window.location.hostname.includes('netlify.app') ||
        window.location.hostname === 'localhost' && window.location.port === '8888';

      const swaggerJsonUrl = isNetlify
        ? '/.netlify/functions/swagger'
        : '/swagger.json';

      // Fetch the Swagger spec
      fetch(swaggerJsonUrl)
        .then(response => response.json())
        .then(spec => {
          SwaggerUIBundle({
            spec: spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
              SwaggerUIBundle.presets.apis,
              SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
            plugins: [
              SwaggerUIBundle.plugins.DownloadUrl
            ],
            layout: "BaseLayout",
            supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
            defaultModelsExpandDepth: 1,
            defaultModelExpandDepth: 1,
            defaultModelRendering: 'model',
            docExpansion: 'list',
            showExtensions: true,
            showCommonExtensions: true,
            tryItOutEnabled: true,
            persistAuthorization: true,
            filter: true,
            displayRequestDuration: true
          });
        })
        .catch(error => {
          console.error('Error loading swagger spec:', error);
          document.getElementById('swagger-ui').innerHTML =
            '<div style="color: red; padding: 20px;">' +
            '<h2>Error Loading API Documentation</h2>' +
            '<p>There was a problem loading the API documentation. Please try again later.</p>' +
            '<p>Error details: ' + error.message + '</p>' +
            '</div>';
        });
    }
  </script>
</body>

</html>
